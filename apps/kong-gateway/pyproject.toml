[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kong-gateway-plugins"
version = "0.1.0"
description = "Kong Gateway Python plugins: session-identity and dynamic-router"
requires-python = ">=3.11"
dependencies = [
    "kong-pdk==0.3.0",
    "psycopg2-binary==2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.8",
    "httpx==0.27.0",
    "ruff==0.4.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/plugins/*/schema.lua",
    # Hyphenated directories are Kong runtime copies; the underscore packages are under test.
    "src/plugins/session-identity/*",
    "src/plugins/dynamic-router/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM", "RUF"]
ignore = ["S101", "UP017"]  # S101: allow assert in tests; UP017: datetime.UTC requires Python 3.11 but tests run on 3.9 locally

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
