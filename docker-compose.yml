# Local development stack (infrastructure baseline).
# Each service owns its own database and dedicated user on the shared PostgreSQL instance (my-db).
# Convention: database == service name, user == <service-name>_user, password == 12345678 (dev only).
#
# Build context for all services is the repo root so npm ci can reach the root package-lock.json.
#
# Services: my-db + kong-gateway + auth-service + content-service + web. The new business domain
# adds its services here and registers them with Kong (4 touchpoints) per CLAUDE.md.

services:
  my-db:
    image: postgres:16-alpine
    container_name: my-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: memorial_site           # superuser for instance management only
      POSTGRES_PASSWORD: memorial_site_dev
      # Creates the first DB; additional DBs + all users are created by the init script below.
      POSTGRES_DB: auth-service
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memorial_site -d auth-service']
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .                                      # repo root — required for package-lock.json
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      my-db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://auth-service_user:12345678@my-db:5432/auth-service
      JWT_ACCESS_SECRET: dev-access-secret-change-in-prod
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-dev}
      # Google sign-in — set these (same Web OAuth Client ID as VITE_GOOGLE_CLIENT_ID)
      # to enable the web login page's "Sign in with Google" flow.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/oauth/callback}
    env_file:
      - apps/auth-service/.env
    ports:
      - '3001:3001'

  content-service:
    build:
      context: .                                      # repo root — required for package-lock.json
      dockerfile: apps/content-service/Dockerfile
    container_name: content-service
    restart: unless-stopped
    depends_on:
      my-db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgres://content-service_user:12345678@my-db:5432/content-service
      OWNER_EMAILS: ${OWNER_EMAILS:-oded.levinger@gmail.com}
      AUTH_SERVICE_URL: http://auth-service:3001
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-dev}
      AUTH_SERVICE_IAM: "false"
      STORAGE_LOCAL_DIR: /tmp/content-files
      STORAGE_PUBLIC_BASE: http://localhost:8000/content-service/content/files
      SEED_SOURCE_URL: http://web
    ports:
      - '3002:3002'

  kong-gateway:
    build:
      context: .                                      # repo root
      dockerfile: apps/kong-gateway/Dockerfile
    container_name: kong-gateway
    restart: unless-stopped
    depends_on:
      my-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: bundled,session_identity,dynamic_router
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_LOG_LEVEL: info
      GATEWAY_DB_HOST: my-db
      GATEWAY_DB_PORT: 5432
      GATEWAY_DB_NAME: gateway-service
      GATEWAY_DB_USER: gateway-service_user
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-12345678}
      GATEWAY_ADMIN_SECRET: ${GATEWAY_ADMIN_SECRET:-change-me-in-dev}
      # Upstream targets — docker-compose service names resolve inside the Docker network
      UPSTREAM_AUTH_TARGET: auth-service:3001
      UPSTREAM_CONTENT_TARGET: content-service:3002
      UPSTREAM_PROTOCOL: http
      GCP_IAM_ENABLED: "false"
      COOKIE_SECURE: "false"
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - kong_logs:/var/log/kong
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .                                      # repo root — required for package-lock.json
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-}
    container_name: web
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://kong-gateway:8000
      KONG_GATEWAY_URL: http://kong-gateway:8000
    ports:
      - '8081:80'

volumes:
  postgres_data:
  kong_logs:
