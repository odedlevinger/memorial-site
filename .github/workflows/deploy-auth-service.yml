name: Deploy auth-service

# Deploys auth-service to Cloud Run on every push to main that touches it.
# Auth to GCP is keyless via Workload Identity Federation (infra/setup_identity.sh).
on:
  push:
    branches: [main]
    paths:
      - 'apps/auth-service/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-auth-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required for Workload Identity Federation

concurrency:
  group: deploy-auth-service
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: memorial-site-oded
  GCP_REGION: me-west1
  AR_REPO: memorial-site                       # Artifact Registry repo (infra/terraform/artifact-registry.tf)
  IMAGE_NAME: auth-service
  CLOUD_RUN_SERVICE: memorial-site-auth        # name expected by infra/terraform/iam.tf invoker binding
  # Keyless auth identifiers (not secrets) — created by infra/setup_identity.sh.
  WIF_PROVIDER: projects/698365944661/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: terraform-runner@memorial-site-oded.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build & push image (tagged with git SHA)
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -f apps/auth-service/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Requires Secret Manager secrets (grant the runtime SA secretAccessor):
      #   auth-service-database-url, auth-service-jwt-access-secret
      # GOOGLE_CLIENT_ID is the public web client id, set as repo variable VITE_GOOGLE_CLIENT_ID.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --port 3001 \
            --no-allow-unauthenticated \
            --add-cloudsql-instances "${GCP_PROJECT_ID}:${GCP_REGION}:my-db" \
            --set-env-vars "NODE_ENV=production,GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
            --update-secrets "DATABASE_URL=auth-service-database-url:latest,JWT_ACCESS_SECRET=auth-service-jwt-access-secret:latest"
