name: Deploy kong-gateway

# Deploys the Kong gateway (the sole public entry point) to Cloud Run on every
# push to main that touches it. Keyless auth via Workload Identity Federation.
on:
  push:
    branches: [main]
    paths:
      - 'apps/kong-gateway/**'
      - '.github/workflows/deploy-kong-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-kong-gateway
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: lavi-memorial
  GCP_REGION: me-west1
  AR_REPO: memorial-site
  IMAGE_NAME: kong-gateway
  CLOUD_RUN_SERVICE: kong-gateway      # name expected by infra/terraform/load-balancer.tf serverless NEG
  WIF_PROVIDER: projects/630004946962/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: terraform-runner@lavi-memorial.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build & push image (tagged with git SHA)
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -f apps/kong-gateway/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Prerequisites:
      #   • auth-service deployed first (this looks up its URL for the upstream + OIDC audience)
      #   • Secret Manager secrets: gateway-service-db-password, gateway-admin-secret
      #     (runtime SA kong-gateway needs secretAccessor)
      #   • enable_service_iam=true applied so Kong's SA can invoke the private auth service
      #   • enable_content_service_iam=true applied so Kong's SA can invoke content-service
      - name: Deploy to Cloud Run
        run: |
          AUTH_URL=$(gcloud run services describe memorial-site-auth \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')
          AUTH_HOST="${AUTH_URL#https://}"
          # content-service may not exist on a first rollout — Kong still deploys and the
          # route 404s at the upstream until content-service is up (re-run this workflow).
          CONTENT_URL=$(gcloud run services describe memorial-site-content \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)' 2>/dev/null || true)
          CONTENT_URL="${CONTENT_URL:-https://content-service.invalid}"
          CONTENT_HOST="${CONTENT_URL#https://}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --cpu-boost \
            --port 8000 \
            --allow-unauthenticated \
            --service-account "kong-gateway@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --add-cloudsql-instances "${GCP_PROJECT_ID}:${GCP_REGION}:my-db" \
            --set-env-vars "GCP_IAM_ENABLED=true,UPSTREAM_PROTOCOL=https,COOKIE_SECURE=true,UPSTREAM_AUTH_TARGET=${AUTH_HOST}:443,UPSTREAM_AUTH_SERVICE_AUDIENCE=${AUTH_URL},UPSTREAM_CONTENT_TARGET=${CONTENT_HOST}:443,UPSTREAM_CONTENT_SERVICE_AUDIENCE=${CONTENT_URL},GATEWAY_DB_HOST=/cloudsql/${GCP_PROJECT_ID}:${GCP_REGION}:my-db,GATEWAY_DB_NAME=gateway-service,GATEWAY_DB_USER=gateway-service_user" \
            --update-secrets "GATEWAY_DB_PASSWORD=gateway-service-db-password:latest,GATEWAY_ADMIN_SECRET=gateway-admin-secret:latest"
